<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagos | Repostería Vanabby</title>

    <link rel="stylesheet" href="../../css/compartido/estructura.css">
    <link rel="stylesheet" href="../../css/pagos/pagos.css">
    <link rel="stylesheet" href="../../css/pagos/modales.css">
</head>

<body class="pagina-sistema">

    <!-- Navegación lateral -->
    <aside class="barra-lateral" aria-label="Barra lateral">

        <a href="../inicio/inicio.html" class="marca">
            <strong>VANABBY</strong>
            <small>Repostería</small>
        </a>

        <nav class="navegacion-principal" aria-label="Navegación principal">
            <a href="../inicio/inicio.html" class="enlace-inicio">
                <span class="icono-navegacion" aria-hidden="true">⌂</span>
                <span>Inicio</span>
            </a>
        </nav>

    </aside>

    <!-- Estructura principal -->
    <div class="estructura-principal">

        <header class="barra-superior">

            <section class="perfil-usuario" aria-label="Sesión actual">

                <span class="icono-perfil" aria-hidden="true">◉</span>

                <p class="datos-usuario">
                    <strong id="nombre-usuario-actual">Usuario</strong>
                    <small id="rol-usuario-actual">Sin identificar</small>
                </p>

            </section>

            <time id="fecha-actual" class="fecha-actual"></time>

            <button
                type="button"
                id="cerrar-sesion"
                class="cerrar-sesion"
                aria-label="Cerrar sesión"
            >
                <span aria-hidden="true">⇥</span>
            </button>

        </header>

        <!-- Vistas cargadas mediante JavaScript -->
        <main class="contenido-principal" id="contenedor-vistas"></main>

        <footer class="pie-pagina">
            <small>Repostería Vanabby - Sistema de Gestión</small>
        </footer>

    </div>

    <!-- Modales cargados mediante JavaScript -->
    <div id="contenedor-modales"></div>

    <script src="../../js/compartido/estructura.js" defer></script>
    <script src="../../js/pagos/cargar-vistas.js" defer></script>

</body>

</html>
