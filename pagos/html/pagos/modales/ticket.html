
<section
    id="modal-ticket"
    class="modal-pagos"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-ticket"
    hidden
>
    <article class="contenido-modal contenido-modal-amplio">

        <header class="encabezado-modal">
            <h2 id="titulo-ticket">Vista previa e impresión del ticket</h2>

            <button
                type="button"
                class="cerrar-modal"
                data-cerrar-modal
                aria-label="Cerrar"
            >
                &times;
            </button>
        </header>

        <div class="cuerpo-modal">

            <div class="distribucion-ticket">

                <!-- Configuración de impresión -->
                <section
                    class="configuracion-ticket"
                    aria-labelledby="titulo-configuracion-ticket"
                >
                    <h3 id="titulo-configuracion-ticket">
                        Configuración
                    </h3>

                    <div class="campo-formulario">
                        <label for="impresora">Impresora</label>

                        <select id="impresora">
                            <option value="termica">Impresora térmica</option>
                            <option value="estandar">Impresora estándar</option>
                        </select>
                    </div>

                    <div class="campo-formulario">
                        <label for="copias">Copias</label>

                        <input
                            id="copias"
                            type="number"
                            min="1"
                            value="1"
                        >
                    </div>

                    <div class="campo-formulario">
                        <label for="papel">Papel</label>

                        <select id="papel">
                            <option value="58">Térmico 58 mm</option>
                            <option value="80">Térmico 80 mm</option>
                        </select>
                    </div>

                    <label class="opcion-ajuste">
                        <input
                            id="ajustar-ticket"
                            type="checkbox"
                            checked
                        >
                        Ajustar al ancho
                    </label>
                </section>

                <!-- Vista previa -->
                <section
                    class="vista-previa-ticket"
                    aria-labelledby="titulo-vista-ticket"
                >
                    <h3 id="titulo-vista-ticket">
                        Vista previa · 58 mm
                    </h3>

                    <div class="fondo-ticket">

                        <article
                            id="ticket-imprimible"
                            class="ticket"
                            aria-label="Comprobante de pago"
                        >
                            <header class="encabezado-ticket">
                                <h4>VANABBY</h4>
                                <p>Repostería</p>

                                <strong>TICKET DE VENTA</strong>
                                <p id="folio-ticket">—</p>
                            </header>

                            <dl class="datos-ticket">
                                <div>
                                    <dt>Fecha</dt>
                                    <dd id="fecha-ticket">—</dd>
                                </div>

                                <div>
                                    <dt>Venta</dt>
                                    <dd id="venta-ticket">—</dd>
                                </div>

                                <div>
                                    <dt>Cliente</dt>
                                    <dd id="cliente-ticket">—</dd>
                                </div>
                            </dl>

                            <hr>

                            <h5>Productos</h5>

                            <dl
                                id="productos-ticket"
                                class="lista-resumen"
                            >
                                <!-- Productos de la venta -->
                            </dl>

                            <hr>

                            <dl class="lista-resumen resumen-ticket">
                                <div>
                                    <dt>Subtotal</dt>
                                    <dd id="subtotal-ticket">—</dd>
                                </div>

                                <div>
                                    <dt>IVA</dt>
                                    <dd id="iva-ticket">—</dd>
                                </div>

                                <div class="total-ticket">
                                    <dt>Total de la venta</dt>
                                    <dd id="total-ticket">—</dd>
                                </div>

                                <div>
                                    <dt>Monto pagado</dt>
                                    <dd id="monto-ticket">—</dd>
                                </div>

                                <div>
                                    <dt>Método de pago</dt>
                                    <dd id="metodo-ticket">—</dd>
                                </div>
                            </dl>

                            <footer class="pie-ticket">
                                <p>¡Gracias por tu compra!</p>
                            </footer>
                        </article>

                    </div>
                </section>

            </div>

            <p
                id="mensaje-ticket"
                class="mensaje-operacion"
                role="status"
                hidden
            ></p>

        </div>

        <footer class="pie-modal">
            <button
                type="button"
                class="boton-secundario"
                data-cerrar-modal
            >
                Cancelar
            </button>

            <button
                id="imprimir-ticket"
                type="button"
                class="boton-principal"
            >
                Imprimir ahora
            </button>
        </footer>

    </article>
</section>
